name: ORCUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install synthesis and simulation tools
        run: sudo apt-get update && sudo apt-get install -y yosys iverilog opensta
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile all Python modules
        run: python -m compileall -q orcus tests examples benchmarks
      - name: Fetch Nangate45 research Liberty
        run: curl -fsSL https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/master/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib -o /tmp/NangateOpenCellLibrary_typical.lib
      - name: Run signed INT4 dot-product reduction benchmark
        run: python benchmarks/signed_int4_dot_product.py --require-tools --require-physical --liberty /tmp/NangateOpenCellLibrary_typical.lib --output /tmp/orcus-int4-dot-product.json
      - name: Upload signed INT4 benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: orcus-signed-int4-dot-product
          path: /tmp/orcus-int4-dot-product.json
          if-no-files-found: error

      - name: Verify benchmark targets
        run: python -m orcus benchmark --max-gates 7 --output /tmp/orcus-ci-smoke.jsonl
