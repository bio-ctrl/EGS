name: ORCUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile all Python modules
        run: python -m compileall -q orcus tests examples benchmarks

      - name: Verify benchmark targets
        run: python -m orcus benchmark --max-gates 7 --output /tmp/orcus-ci-smoke.jsonl
