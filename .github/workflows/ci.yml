name: ORCUS CI

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile all Python modules
        run: python -m compileall -q orcus tests examples benchmarks

      - name: Verify benchmark targets
        run: python -m orcus benchmark --max-gates 7 --output /tmp/orcus-ci-smoke.jsonl
      - name: Verify joint-search benchmark
        run: python benchmarks/joint_search_smoke.py --max-gates 3 --output /tmp/orcus-joint-smoke.json
      - name: Install independent synthesis tool
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Run diverse joint-search benchmark suite
        run: python benchmarks/joint_search_suite.py --max-gates 3 --require-yosys --output /tmp/orcus-joint-suite.json
      - name: Run bit-level adder architecture experiment
        run: python benchmarks/adder_architecture_suite.py --widths 4 8 16 32 --require-yosys --output /tmp/orcus-adder-suite.json

      - name: Upload research benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: orcus-joint-search-reports
          path: |
            /tmp/orcus-joint-smoke.json
            /tmp/orcus-joint-suite.json
            /tmp/orcus-adder-suite.json
          if-no-files-found: error
