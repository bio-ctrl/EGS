name: Elstella ORIGIN ATLAS CI
on:
  push:
    paths:
      - "elstella-origin/**"
  pull_request:
    paths:
      - "elstella-origin/**"
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elstella-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
