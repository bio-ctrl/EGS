name: ORCUS ECP5 FPGA Validation

on:
  push:
    branches: [main]
    paths-ignore: [STATUS.md]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/fpga-ecp5.yml"
      - "orcus/lane_scaling.py"
      - "benchmarks/ecp5_fpga_validation.py"
      - "tests/test_fpga_validation.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecp5-place-and-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Yosys and ECP5 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ecp5
      - name: Record tool versions
        run: |
          yosys -V
          nextpnr-ecp5 --version
          nextpnr-ecp5 --help | grep -E -- '--85k|--package|--speed|--report'
      - name: Run wrapper tests and FPGA P&R matrix
        run: |
          python -m unittest discover -s tests -p test_fpga_validation.py -v
          python -u benchmarks/ecp5_fpga_validation.py --require-tools --output /tmp/orcus-ecp5-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: orcus-ecp5-fpga-validation
          path: /tmp/orcus-ecp5-validation.json
          if-no-files-found: error
