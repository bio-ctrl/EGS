[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcus-hardware-discovery"
version = "0.1.0"
description = "A reproducible Boolean-circuit architecture exploration baseline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ORCUS Research" }]
keywords = ["logic synthesis", "Boolean circuits", "hardware architecture", "design-space exploration"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
orcus = "orcus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orcus*"]
